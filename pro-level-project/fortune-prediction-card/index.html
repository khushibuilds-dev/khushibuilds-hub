<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Teller and Prediction Card Generator</title>
    <link rel="stylesheet" href = "styles.css">
</head>
<body>
  <div class = "container">

    <!-- PAGE 1:  NAME INPUT-->

    <div id = "input-page" class = "page">
      <h1>Fortune Teller</h1>
      <p>Sitare sirf raasta dikhate hain, chalna toh aapko khud hi padega.</p>
      <div class="crystal-ball">🔮</div>
      <p>Apna naam dalein aur jaanein ki aaj aapki life ka meter kya keh raha hai!👇</p>
      <input type = "text" id = "username" placeholder = "Enter your name here..." required> 
      <br>
      <button onclick = "fortuneTeller()">
        <span class="text">Click Here</span>
      </button>
    </div>
    
    <!--PAGE 2: FORTUNE RESULT -->

    <div id = "fortune-result" class = "page ">
      <h2>Apka Fortune Result</h2>
      <p></p>
      <p id = "fortune-message">Reading your stars...</p>
    </div>
    
    <!--PAGE 3: FORTUNE METER -->

    <div id = "fortune-meter">
    <h3>Kya aap aaaj ka apna fortune meter dhekna chahate hai.....? </h3>
    <span class = "click-here">👉</span> <button onclick = "fortuneMeter()">Click here</button>
    </div>

  </div>
  <script src="script.js"></script>
 </body>
